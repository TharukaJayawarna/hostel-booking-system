<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{emails/common-layout}">
<body>

<div layout:fragment="content">
  <h2 style="color: #111827; margin-top: 0;">Password Reset Request</h2>
  <p>Hello <strong th:text="${name}">User</strong>,</p>

  <p>We received a request to reset the password for your Hostel PMS account. Use the following One-Time Password (OTP) to complete the process:</p>

  <div style="text-align: center; margin: 30px 0;">
    <span style="font-size: 32px; font-weight: 800; letter-spacing: 5px; color: #4f46e5; background: #eef2ff; padding: 10px 20px; border-radius: 8px; border: 1px dashed #6366f1;" th:text="${otp}">123456</span>
  </div>

  <p>This code is valid for <strong>5 minutes</strong>. If you did not request this, please ignore this email.</p>
</div>

</body>
</html>
