<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{emails/common-layout}">
<body>
<div layout:fragment="content">
    <div style="text-align: center;">
        <div style="background-color: #fee2e2; width: 60px; height: 60px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 20px;">
            <span style="font-size: 30px; color: #ef4444;">✕</span>
        </div>
        <h2 style="color: #ef4444; margin-top: 0;">Booking Failed</h2>
    </div>

    <p>Dear <strong th:text="${studentName}">Student</strong>,</p>

    <p>We regret to inform you that your reservation attempt (Ref: <strong th:text="${reservationNumber}">#123</strong>) was unsuccessful due to a payment failure or timeout.</p>

    <p>Your selected bed has been released. You may try to make a new reservation.</p>

    <div style="text-align: center;">
        <a href="http://localhost:5173/hostel" class="button">Try Again</a>
    </div>
</div>
</body>
</html>
